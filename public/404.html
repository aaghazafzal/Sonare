<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f1012" />
    <title>Page not found — Sonare</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0f1012;
        color: #ebe7df;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 520px;
      }
      .code {
        margin: 8px 0 0;
        font-size: clamp(64px, 16vw, 112px);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.05em;
        color: #e3a043;
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 6vw, 38px);
        letter-spacing: -0.025em;
      }
      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.6;
        color: #a19d95;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 8px;
      }
      a {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 18px;
        border-radius: 6px;
        border: 1px solid #3c3e45;
        background: #202125;
        color: #ebe7df;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
      }
      a.primary {
        background: #e3a043;
        border-color: #e3a043;
        color: #1c1306;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 28 28" width="44" height="44" aria-hidden="true">
        <rect x="1" y="1" width="26" height="26" rx="6" fill="#202125" stroke="#3c3e45" />
        <g fill="#ebe7df">
          <rect x="6" y="6" width="3.4" height="16" rx="1" />
          <rect x="10.6" y="6" width="3.4" height="16" rx="1" />
          <rect x="15.2" y="6" width="3.4" height="16" rx="1" />
          <rect x="19.8" y="6" width="3.4" height="16" rx="1" />
        </g>
        <g fill="#e3a043">
          <rect x="8.6" y="6" width="2.8" height="9.5" rx="0.8" />
          <rect x="17.8" y="6" width="2.8" height="9.5" rx="0.8" />
        </g>
      </svg>
      <p class="code">404</p>
      <h1>This page hit a wrong note</h1>
      <p>There’s nothing at this address. It may have moved, or the link may be mistyped.</p>
      <div class="actions">
        <a class="primary" href="/#/home">Go to the home page</a>
        <a href="/#/play">Play an instrument</a>
      </div>
    </main>
  </body>
</html>
